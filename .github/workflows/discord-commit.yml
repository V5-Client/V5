name: Publish Release

on:
    push:
        branches:
            - '**'
    workflow_dispatch:
        inputs:
            sha:
                description: 'Commit SHA to run against (optional).'
                required: false
                type: string

jobs:
    publish:
        if: ${{ github.repository == 'V5-Client/V5' && github.ref == 'refs/heads/main' }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            contents: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ inputs.sha || github.sha }}

            - name: Build release ZIP
              shell: bash
              run: |
                  set -euo pipefail
                  workdir="$(mktemp -d)"
                  trap 'rm -rf "$workdir"' EXIT
                  source_dir="$workdir/source"
                  mkdir -p "$source_dir"
                  cp -a . "$source_dir"/
                  rm -rf "$source_dir/.git" "$source_dir/.github" "$source_dir/.vscode"
                  rm -f \
                    "$source_dir/.gitignore" \
                    "$source_dir/.prettierrc.json" \
                    "$source_dir/jsconfig.json" \
                    "$source_dir/typings.d.ts"
                  (cd "$source_dir" && zip -qr "$GITHUB_WORKSPACE/V5-Mojmap.zip" .)

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ inputs.sha || github.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  version=$(jq -er '.version' metadata.json)
                  prefix="${version//./\\.}-r"
                  tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.target_commitish == \"$SHA\") | .tag_name" | sed -nE "s/^${prefix}[0-9]+$/&/p" | head -n1)
                  if [ -z "$tag" ]; then
                    revision=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | sed -nE "s/^${prefix}([0-9]+)$/\1/p" | sort -n | tail -n1)
                    tag="${version}-r$(( ${revision:-0} + 1 ))"
                    gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
                  fi
                  gh release upload "$tag" V5-Mojmap.zip --clobber
